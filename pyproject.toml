[project]
name = "seekbind"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "google-search-results>=2.4.2",
    "langfuse<3",
    "numpy>=2.5.1",
    "openai>=2.48.0",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/integration bir pytest oturumunda tek bir gerçek Postgres connection
# pool'u (get_engine(), @lru_cache) paylaşıyor — pytest-asyncio'nun
# varsayılanı (her test fonksiyonuna ayrı event loop) bu pool'u ilk kurulduğu
# loop'a kilitler, sonraki testler farklı bir loop'ta çalışırsa asyncpg
# "attached to a different loop" hatası verir. Tüm oturumun tek event loop
# paylaşması bunu çözer; unit testler saf mock kullandığı için (gerçek
# asyncpg/network bağlantısı yok) bu değişiklikten etkilenmez.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: gerçek Postgres/Qdrant'a karşı çalışır, docker-compose servislerinin ayakta olmasını gerektirir (varsayılan çalıştırmada hariç tutulur)",
    "requires_ollama: gerçek, yerel bir Ollama sunucusu (docker-compose değil, native kurulum) gerektirir — feature/ci-setup bu testleri ayrıca ele almalı",
]
addopts = "-m 'not integration'"
